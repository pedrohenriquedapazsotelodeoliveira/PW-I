<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carros Esportivos</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
}

header {
  background: #e50914;
  text-align: center;
  padding: 30px;
}

header h1 {
  font-size: 35px;
}

.container {
  width: 90%;
  max-width: 1000px;
  margin: 30px auto;
}

.carros {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  justify-content: center;
}

.card {
  background: #222;
  width: 280px;
  border-radius: 12px;
  overflow: hidden;
  text-align: center;
  box-shadow: 0 5px 15px #000;
}

.card img {
  width: 100%;
  height: 170px;
  object-fit: cover;
}

.card h2 {
  margin: 15px 0 10px;
}

.card p {
  color: #ccc;
  margin-bottom: 15px;
}

.preco {
  color: #e50914;
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 20px;
}

button {
  background: #e50914;
  color: white;
  border: 0;
  padding: 10px 25px;
  border-radius: 6px;
  margin-bottom: 20px;
  cursor: pointer;
}

button:hover {
  background: #b20710;
}

footer {
  text-align: center;
  padding: 25px;
  margin-top: 30px;
  background: #222;
  color: #aaa;
}
</style>
</head>

<body>

<header>
  <h1>🏎️ Carros Esportivos</h1>
  <p>Conheça alguns carros incríveis!</p>
</header>

<div class="container">

  <div class="carros">

    <div class="card">
      <img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70" alt="Carro esportivo">
      <h2>Carro Esportivo</h2>
      <p>Motor potente e design moderno.</p>
      <div class="preco">R$ 250.000</div>
      <button>Saiba mais</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1542362567-b07e54358753" alt="Carro vermelho">
      <h2>Super Carro</h2>
      <p>Velocidade e tecnologia.</p>
      <div class="preco">R$ 450.000</div>
      <button>Saiba mais</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1553440569-bcc63803a83d" alt="Carro de luxo">
      <h2>Carro de Luxo</h2>
      <p>Conforto, potência e elegância.</p>
      <div class="preco">R$ 600.000</div>
      <button>Saiba mais</button>
    </div>

  </div>

</div>

<footer>
  © 2026 - Minha Página de Carros 🚗
</footer>

</body>
</html>
